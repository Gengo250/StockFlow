[project]
name = "stockflow"
version = "0.1.0"
description = "StockFlow - sistema de gerenciamento de estoque"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.7",
    "qtawesome>=1.3",
]

[project.scripts]
stockflow = "stockflow.presentation.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockflow"]

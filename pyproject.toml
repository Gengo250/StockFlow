[project]
name = "stockflow"
version = "0.1.0"
description = "StockFlow - sistema de gerenciamento de estoque"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.7",
    "python-dotenv>=1.2.3",
    "qtawesome>=1.3",
    "supabase>=2.31.0",
]

[project.scripts]
stockflow = "stockflow.presentation.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockflow"]

[dependency-groups]
dev = [
    "psycopg[binary]>=3.2",
    "pyinstaller>=6.22.3",
    "pytest>=9",
]
